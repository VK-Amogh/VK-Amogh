<svg width="440" height="252" viewBox="0 0 440 252" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vetifi AI — Care, with evidence.">
  <defs>
    <clipPath id="pclip_vetifi">
      <rect x="1" y="1" width="438" height="250" rx="16"/>
    </clipPath>
    <style>
      .serif { font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#pclip_vetifi)">
    <rect x="0" y="0" width="440" height="252" fill="#F1B48E"/>

    <!-- Flat drifting Bauhaus solid forms (straight from Poster.jsx) -->
    
        <path d="M 252 252 V 82 A 92 92 0 0 1 436 82 V 252 Z" fill="#9DBDD8">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="10.5s" repeatCount="indefinite"/>
        </path>
        <circle cx="18" cy="240" r="68" fill="#F4EDE3" opacity="0.58"/>
        <rect x="330" y="196" width="96" height="62" rx="10" fill="#BACFAE"/>

    <!-- Top meta bar -->
    <text x="26" y="30" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.72" letter-spacing="1.7">VETIFI AI</text>
    <text x="414" y="30" text-anchor="end" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.72" letter-spacing="1.5">2025–2026</text>

    <!-- Two-line editorial serif headline (second line italic!) -->
    <text x="26" y="102" class="serif" font-size="34" font-weight="400" fill="#1A1412" letter-spacing="-0.6">Care,</text>
    <text x="26" y="138" class="serif" font-size="34" font-weight="400" font-style="italic" fill="#1A1412" letter-spacing="-0.6">with evidence.</text>

    <!-- Concise tagline -->
    <text x="26" y="166" class="sans" font-size="11.5" fill="#1A1412" fill-opacity="0.78">Clinical veterinary RAG &amp; knowledge graph.</text>
    <text x="26" y="182" class="sans" font-size="11.5" fill="#1A1412" fill-opacity="0.78">10,000+ active vets · 96.23% accuracy</text>

    <!-- Bespoke animated architectural vector motif on right -->
    <g transform="translate(274, 62)">
      <rect x="0" y="0" width="140" height="122" rx="12" fill="#F4EDE3" fill-opacity="0.88" stroke="#1A1412" stroke-opacity="0.22" stroke-width="1"/>
      
        <circle cx="70" cy="54" r="30" fill="none" stroke="#1A1412" stroke-opacity="0.2" stroke-width="1"/>
        <g>
          <circle cx="70" cy="24" r="5" fill="#F0926A" stroke="#1A1412" stroke-width="0.9"/>
          <circle cx="100" cy="54" r="4.5" fill="#9DBDD8" stroke="#1A1412" stroke-width="0.9"/>
          <circle cx="40" cy="54" r="4.5" fill="#E9BF52" stroke="#1A1412" stroke-width="0.9"/>
          <circle cx="70" cy="84" r="5" fill="#BACFAE" stroke="#1A1412" stroke-width="0.9"/>
          <animateTransform attributeName="transform" type="rotate" from="0 70 54" to="360 70 54" dur="16s" repeatCount="indefinite"/>
        </g>
        <circle cx="70" cy="54" r="11" fill="#F1B48E" stroke="#1A1412" stroke-width="1"/>
        <rect x="68" y="48" width="4" height="12" rx="1.5" fill="#1A1412"/>
        <rect x="64" y="52" width="12" height="4" rx="1.5" fill="#1A1412"/>
        <text x="12" y="112" class="sans" font-size="8" font-weight="600" fill="#8F3E26" letter-spacing="1.2">BM25 + ONTOLOGY</text>
    </g>

    <!-- Bottom editorial footer & arrow -->
    <line x1="26" y1="214" x2="414" y2="214" stroke="#1A1412" stroke-opacity="0.16" stroke-width="1"/>
    <text x="26" y="234" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.76" letter-spacing="1.6">RETRIEVE, REASON, RECOMMEND</text>
    <text x="414" y="235" text-anchor="end" class="sans" font-size="15" font-weight="400" fill="#1A1412">↗</text>
  </g>

  <rect x="1" y="1" width="438" height="250" rx="16" stroke="#1A1412" stroke-opacity="0.14" stroke-width="1"/>
</svg>
