<svg width="440" height="252" viewBox="0 0 440 252" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saral AI — Civic life, made simple.">
  <defs>
    <clipPath id="pclip_saral">
      <rect x="1" y="1" width="438" height="250" rx="16"/>
    </clipPath>
    <style>
      .serif { font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#pclip_saral)">
    <rect x="0" y="0" width="440" height="252" fill="#9DBDD8"/>

    <!-- Flat drifting Bauhaus solid forms (straight from Poster.jsx) -->
    
        <path d="M 248 252 V 76 A 96 96 0 0 1 440 76 V 252 Z" fill="#F4EDE3" opacity="0.62">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="11.5s" repeatCount="indefinite"/>
        </path>
        <circle cx="38" cy="242" r="56" fill="#F0926A"/>
        <rect x="308" y="196" width="120" height="62" rx="31" fill="#E9BF52"/>

    <!-- Top meta bar -->
    <text x="26" y="30" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.72" letter-spacing="1.7">SARAL AI</text>
    <text x="414" y="30" text-anchor="end" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.72" letter-spacing="1.5">2026</text>

    <!-- Two-line editorial serif headline (second line italic!) -->
    <text x="26" y="102" class="serif" font-size="34" font-weight="400" fill="#1A1412" letter-spacing="-0.6">Civic life,</text>
    <text x="26" y="138" class="serif" font-size="34" font-weight="400" font-style="italic" fill="#1A1412" letter-spacing="-0.6">made simple.</text>

    <!-- Concise tagline -->
    <text x="26" y="166" class="sans" font-size="11.5" fill="#1A1412" fill-opacity="0.78">Privacy-first Flutter civic assistant.</text>
    <text x="26" y="182" class="sans" font-size="11.5" fill="#1A1412" fill-opacity="0.78">12-state FastAPI · FLAG_SECURE vault</text>

    <!-- Bespoke animated architectural vector motif on right -->
    <g transform="translate(274, 62)">
      <rect x="0" y="0" width="140" height="122" rx="12" fill="#F4EDE3" fill-opacity="0.88" stroke="#1A1412" stroke-opacity="0.22" stroke-width="1"/>
      
        <rect x="46" y="14" width="48" height="76" rx="11" fill="#ECE3D5" stroke="#1A1412" stroke-width="1.1"/>
        <line x1="63" y1="22" x2="77" y2="22" stroke="#1A1412" stroke-width="1.2" stroke-linecap="round"/>
        <rect x="54" y="31" width="32" height="16" rx="4" fill="#F0926A" opacity="0.82"/>
        <line x1="54" y1="57" x2="86" y2="57" stroke="#1A1412" stroke-opacity="0.35" stroke-width="1.2"/>
        <line x1="54" y1="65" x2="76" y2="65" stroke="#1A1412" stroke-opacity="0.35" stroke-width="1.2"/>
        <circle cx="54" cy="76" r="3" fill="#1E5A52">
          <animate attributeName="cx" values="54;84;54" dur="3.6s" repeatCount="indefinite"/>
        </circle>
        <text x="12" y="112" class="sans" font-size="8" font-weight="600" fill="#8F3E26" letter-spacing="1.2">ZERO CLOUD SECRETS</text>
    </g>

    <!-- Bottom editorial footer & arrow -->
    <line x1="26" y1="214" x2="414" y2="214" stroke="#1A1412" stroke-opacity="0.16" stroke-width="1"/>
    <text x="26" y="234" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.76" letter-spacing="1.6">ASK, AUTOMATE, VAULT</text>
    <text x="414" y="235" text-anchor="end" class="sans" font-size="15" font-weight="400" fill="#1A1412">↗</text>
  </g>

  <rect x="1" y="1" width="438" height="250" rx="16" stroke="#1A1412" stroke-opacity="0.14" stroke-width="1"/>
</svg>
