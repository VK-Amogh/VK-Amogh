<svg width="440" height="252" viewBox="0 0 440 252" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Developer Community — Students who ship.">
  <defs>
    <clipPath id="pclip_tdc">
      <rect x="1" y="1" width="438" height="250" rx="16"/>
    </clipPath>
    <style>
      .serif { font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#pclip_tdc)">
    <rect x="0" y="0" width="440" height="252" fill="#EDB3C3"/>

    <!-- Flat drifting Bauhaus solid forms (straight from Poster.jsx) -->
    
        <circle cx="350" cy="96" r="98" fill="#E9BF52">
          <animateTransform attributeName="transform" type="translate" values="0,0; 6,-6; 0,0" dur="12s" repeatCount="indefinite"/>
        </circle>
        <path d="M -22 252 V 190 A 74 74 0 0 1 126 190 V 252 Z" fill="#F4EDE3" opacity="0.58"/>
        <rect x="314" y="196" width="114" height="62" rx="31" fill="#BACFAE"/>

    <!-- Top meta bar -->
    <text x="26" y="30" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.72" letter-spacing="1.7">THE DEVELOPER COMMUNITY</text>
    <text x="414" y="30" text-anchor="end" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.72" letter-spacing="1.5">2025–2026</text>

    <!-- Two-line editorial serif headline (second line italic!) -->
    <text x="26" y="102" class="serif" font-size="34" font-weight="400" fill="#1A1412" letter-spacing="-0.6">Students</text>
    <text x="26" y="138" class="serif" font-size="34" font-weight="400" font-style="italic" fill="#1A1412" letter-spacing="-0.6">who ship.</text>

    <!-- Concise tagline -->
    <text x="26" y="166" class="sans" font-size="11.5" fill="#1A1412" fill-opacity="0.78">1,000+ registrations across 5+ univs.</text>
    <text x="26" y="182" class="sans" font-size="11.5" fill="#1A1412" fill-opacity="0.78">React Router 7 SSR · ONE-CREW · STASH</text>

    <!-- Bespoke animated architectural vector motif on right -->
    <g transform="translate(274, 62)">
      <rect x="0" y="0" width="140" height="122" rx="12" fill="#F4EDE3" fill-opacity="0.88" stroke="#1A1412" stroke-opacity="0.22" stroke-width="1"/>
      
        <polygon points="70,22 108,82 32,82" fill="none" stroke="#1A1412" stroke-opacity="0.28" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="3.2" fill="#1A1412">
          <animateMotion dur="5.2s" repeatCount="indefinite" path="M 70,22 L 108,82 L 32,82 Z"/>
        </circle>
        <circle cx="70" cy="22" r="8" fill="#E9BF52" stroke="#1A1412" stroke-width="1"/>
        <circle cx="108" cy="82" r="8" fill="#F0926A" stroke="#1A1412" stroke-width="1"/>
        <circle cx="32" cy="82" r="8" fill="#9DBDD8" stroke="#1A1412" stroke-width="1"/>
        <text x="12" y="112" class="sans" font-size="8" font-weight="600" fill="#8F3E26" letter-spacing="1.2">20 COHORT 1 INTERNS</text>
    </g>

    <!-- Bottom editorial footer & arrow -->
    <line x1="26" y1="214" x2="414" y2="214" stroke="#1A1412" stroke-opacity="0.16" stroke-width="1"/>
    <text x="26" y="234" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.76" letter-spacing="1.6">LEARN, BUILD, PROVE</text>
    <text x="414" y="235" text-anchor="end" class="sans" font-size="15" font-weight="400" fill="#1A1412">↗</text>
  </g>

  <rect x="1" y="1" width="438" height="250" rx="16" stroke="#1A1412" stroke-opacity="0.14" stroke-width="1"/>
</svg>
