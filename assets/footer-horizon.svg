<svg width="900" height="184" viewBox="0 0 900 184" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Amogh V K editorial horizon footer">
  <defs>
    <clipPath id="footClip">
      <rect x="1" y="1" width="898" height="182" rx="18"/>
    </clipPath>
    <style>
      .serif { font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#footClip)">
    <rect x="0" y="0" width="900" height="184" fill="#F4EDE3"/>

    <!-- Left: Horizon Sculpture (SectionArt.jsx) -->
    <g transform="translate(128, 96)">
      <circle cx="0" cy="0" r="58" fill="none" stroke="#1A1412" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="2 6">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="36s" repeatCount="indefinite"/>
      </circle>
      <path d="M -46 18 A 46 46 0 0 1 46 18 Z" fill="#F0926A">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="5.5s" repeatCount="indefinite"/>
      </path>
      <circle cx="38" cy="-34" r="16" fill="#E9BF52">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <line x1="-60" y1="18" x2="60" y2="18" stroke="#1A1412" stroke-opacity="0.38" stroke-width="1"/>
      <rect x="-42" y="27" width="84" height="8" rx="4" fill="#9DBDD8"/>
      <rect x="-26" y="40" width="52" height="8" rx="4" fill="#BACFAE"/>
    </g>

    <line x1="256" y1="24" x2="256" y2="160" stroke="#DDD4C7" stroke-width="1"/>

    <!-- Right: Editorial Quote & Colophon -->
    <text x="292" y="48" class="sans" font-size="9.5" font-weight="600" fill="#8F3E26" letter-spacing="2">COLOPHON · QUIET STUDIO</text>
    <text x="292" y="88" class="serif" font-size="24" font-style="italic" fill="#1A1412">“What people find boring, is what interests me.”</text>
    <text x="292" y="116" class="sans" font-size="13" fill="#3D2F28">Engineering intelligent systems quietly, rigorously, and end to end.</text>

    <line x1="292" y1="136" x2="864" y2="136" stroke="#DDD4C7" stroke-width="1"/>
    <text x="292" y="156" class="sans" font-size="9.5" font-weight="600" fill="#3D2F28" letter-spacing="1.8">AMOGH V K  ·  EVENEI  ·  THE DEVELOPER COMMUNITY</text>
    <text x="864" y="156" text-anchor="end" class="sans" font-size="9.5" font-weight="600" fill="#8F3E26" letter-spacing="1.6">BENGALURU · 12.97° N</text>
  </g>

  <rect x="1" y="1" width="898" height="182" rx="18" stroke="#C5B9A9" stroke-width="1"/>
</svg>
