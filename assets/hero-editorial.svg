<svg width="900" height="456" viewBox="0 0 900 456" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Amogh V K — Quiet Studio Editorial Profile">
  <defs>
    <clipPath id="heroFrame">
      <rect x="1" y="1" width="898" height="454" rx="18"/>
    </clipPath>
    <style>
      .serif { font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#heroFrame)">
    <!-- Warm cotton paper canvas -->
    <rect x="0" y="0" width="900" height="456" fill="#F4EDE3"/>

    <!-- 4-column quiet vertical hairline grid (straight from amogh.evenei.com) -->
    <line x1="225" y1="48" x2="225" y2="456" stroke="#1A1412" stroke-opacity="0.045" stroke-width="1"/>
    <line x1="450" y1="48" x2="450" y2="456" stroke="#1A1412" stroke-opacity="0.045" stroke-width="1"/>
    <line x1="675" y1="48" x2="675" y2="456" stroke="#1A1412" stroke-opacity="0.045" stroke-width="1"/>

    <!-- Subtle drifting flat Bauhaus geometric forms in background (KineticShapes.jsx) -->
    <circle cx="38" cy="144" r="14" fill="#9DBDD8" opacity="0.34">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <rect x="336" y="96" width="16" height="16" rx="4" fill="#E9BF52" opacity="0.38">
      <animateTransform attributeName="transform" type="rotate" values="0 344 104; 90 344 104; 0 344 104" dur="14s" repeatCount="indefinite"/>
    </rect>
    <path d="M 488 268 V 252 A 13 13 0 0 1 514 252 V 268 Z" fill="#BACFAE" opacity="0.42">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,6; 0,0" dur="10s" repeatCount="indefinite"/>
    </path>
    <rect x="846" y="294" width="34" height="14" rx="7" fill="#EDB3C3" opacity="0.48">
      <animateTransform attributeName="transform" type="translate" values="0,0; -6,0; 0,0" dur="11s" repeatCount="indefinite"/>
    </rect>
    <circle cx="526" cy="96" r="16" fill="none" stroke="#8F3E26" stroke-width="1.2" opacity="0.24">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,5; 0,0" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Quiet Editorial Masthead Bar -->
    <rect x="0" y="0" width="900" height="48" fill="#F4EDE3"/>
    <line x1="0" y1="48" x2="900" y2="48" stroke="#DDD4C7" stroke-width="1"/>
    <!-- Animated terracotta scroll hairline (exact scroll-hairline motif from portfolio) -->
    <rect x="0" y="47" width="180" height="1.8" fill="#D95D39">
      <animate attributeName="x" values="0;720;0" dur="11s" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>

    <text x="36" y="30" class="serif" font-size="19" font-weight="500" fill="#1A1412">Amogh VK<tspan fill="#D95D39">.</tspan></text>

    <g class="sans" font-size="9.5" font-weight="500" fill="#3D2F28" letter-spacing="1.7">
      <text x="415" y="28">WORK</text>
      <text x="478" y="28">PROGRESS</text>
      <text x="568" y="28">CRAFT</text>
      <text x="636" y="28">WRITING</text>
    </g>

    <!-- Top-right solid ink Resume / Portfolio pill -->
    <rect x="760" y="12" width="104" height="24" rx="12" fill="#1A1412"/>
    <text x="812" y="27.5" text-anchor="middle" class="sans" font-size="9.5" font-weight="500" fill="#F4EDE3" letter-spacing="1.3">PORTFOLIO ↗</text>

    <!-- HERO LEFT COLUMN -->
    <text x="36" y="88" class="sans" font-size="10" font-weight="600" fill="#8F3E26" letter-spacing="2.1">ENGINEERING, AI AND PRODUCT</text>

    <text x="34" y="152" class="serif" font-size="60" font-weight="400" fill="#1A1412" letter-spacing="-1">Amogh <tspan font-style="italic" fill="#D95D39">VK.</tspan></text>

    <text x="36" y="186" class="sans" font-size="20.5" font-weight="400" fill="#1A1412" letter-spacing="-0.3">I turn ambitious ideas into useful</text>
    <text x="36" y="212" class="sans" font-size="20.5" font-weight="400" fill="#1A1412" letter-spacing="-0.3">technology and ventures.</text>

    <text x="36" y="242" class="sans" font-size="13" fill="#3D2F28">Founder of EvenEi and The Developer Community, studying ECE at MIT Bengaluru.</text>
    <text x="36" y="261" class="sans" font-size="13" fill="#3D2F28">Building across software, AI, hardware, security, and spacecraft systems.</text>

    <!-- Editorial Clean Pills (.btn-ink & .btn-clean) -->
    <g transform="translate(36, 282)">
      <rect x="0" y="0" width="194" height="32" rx="16" fill="#1A1412"/>
      <text x="97" y="19.5" text-anchor="middle" class="sans" font-size="10" font-weight="500" fill="#F4EDE3" letter-spacing="1.3">AMOGH.EVENEI.COM  ↗</text>

      <rect x="206" y="0" width="198" height="32" rx="16" fill="#F4EDE3" stroke="#C5B9A9" stroke-width="1"/>
      <text x="305" y="19.5" text-anchor="middle" class="sans" font-size="10" font-weight="500" fill="#3D2F28" letter-spacing="1.3">BENGALURU, INDIA · 12.97° N</text>
    </g>

    <!-- HERO RIGHT COLUMN: Animated Quiet Studio Constellation Plate (SectionArt.jsx) -->
    <g transform="translate(556, 72)">
      <rect x="0" y="0" width="308" height="242" rx="14" fill="#ECE3D5" stroke="#C5B9A9" stroke-width="1"/>

      <!-- Plate top window bar -->
      <line x1="0" y1="30" x2="308" y2="30" stroke="#DDD4C7" stroke-width="1"/>
      <circle cx="16" cy="15" r="3.5" fill="#F0926A"/>
      <circle cx="28" cy="15" r="3.5" fill="#E9BF52"/>
      <circle cx="40" cy="15" r="3.5" fill="#BACFAE"/>
      <text x="154" y="18.5" text-anchor="middle" class="sans" font-size="9.5" font-weight="600" fill="#3D2F28" letter-spacing="1.5">SYSTEMS CONSTELLATION</text>
      <text x="294" y="18.5" text-anchor="end" class="mono" font-size="9" fill="#8F3E26">04</text>

      <!-- Systems Constellation artwork (exact geometry from SectionArt.jsx) -->
      <g transform="translate(0, 26)">
        <circle cx="154" cy="84" r="64" fill="none" stroke="#1A1412" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 6">
          <animateTransform attributeName="transform" type="rotate" from="0 154 84" to="360 154 84" dur="44s" repeatCount="indefinite"/>
        </circle>
        <circle cx="154" cy="84" r="35" fill="none" stroke="#1A1412" stroke-opacity="0.12" stroke-width="1"/>

        <!-- Connecting lines -->
        <path d="M 86 48 L 210 38 L 228 118 L 100 128 Z" fill="none" stroke="#1A1412" stroke-opacity="0.24" stroke-width="1"/>
        <line x1="86" y1="48" x2="228" y2="118" stroke="#1A1412" stroke-opacity="0.12" stroke-width="1"/>
        <line x1="210" y1="38" x2="100" y2="128" stroke="#1A1412" stroke-opacity="0.12" stroke-width="1"/>

        <!-- Animated ink traveler moving quietly along the constellation edges -->
        <circle cx="0" cy="0" r="3.4" fill="#1A1412">
          <animateMotion dur="9.5s" repeatCount="indefinite" path="M 86,48 L 210,38 L 228,118 L 100,128 Z"/>
        </circle>

        <!-- 4 flat solid pastel principle nodes -->
        <circle cx="86" cy="48" r="15" fill="#F0926A">
          <animate attributeName="r" values="14.5;16.5;14.5" dur="5.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="86" cy="48" r="20" fill="none" stroke="#1A1412" stroke-opacity="0.18" stroke-width="0.9"/>

        <circle cx="210" cy="38" r="13" fill="#9DBDD8">
          <animate attributeName="r" values="12.5;14.2;12.5" begin="1.2s" dur="5.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="210" cy="38" r="18" fill="none" stroke="#1A1412" stroke-opacity="0.14" stroke-width="0.9"/>

        <circle cx="228" cy="118" r="16" fill="#E9BF52">
          <animate attributeName="r" values="15.5;17.2;15.5" begin="2.4s" dur="5.0s" repeatCount="indefinite"/>
        </circle>
        <circle cx="228" cy="118" r="21" fill="none" stroke="#1A1412" stroke-opacity="0.14" stroke-width="0.9"/>

        <circle cx="100" cy="128" r="13.5" fill="#BACFAE">
          <animate attributeName="r" values="13;14.8;13" begin="3.6s" dur="5.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="100" cy="128" r="18.5" fill="none" stroke="#1A1412" stroke-opacity="0.14" stroke-width="0.9"/>

        <!-- Center paper diamond -->
        <rect x="148" y="78" width="12" height="12" rx="2" fill="#F4EDE3" stroke="#1A1412" stroke-width="1" transform="rotate(45 154 84)"/>

        <!-- Crisp micro node captions -->
        <text x="58" y="25" class="sans" font-size="8.5" font-weight="600" fill="#3D2F28" letter-spacing="1.2">SYSTEMS</text>
        <text x="228" y="21" class="sans" font-size="8.5" font-weight="600" fill="#3D2F28" letter-spacing="1.2">LIMITS</text>
        <text x="234" y="153" text-anchor="middle" class="sans" font-size="8.5" font-weight="600" fill="#3D2F28" letter-spacing="1.2">PROOF</text>
        <text x="64" y="153" class="sans" font-size="8.5" font-weight="600" fill="#3D2F28" letter-spacing="1.2">CLARITY</text>
      </g>

      <!-- Bottom integrated damped B-dot oscillation strip -->
      <line x1="0" y1="196" x2="308" y2="196" stroke="#DDD4C7" stroke-width="1"/>
      <line x1="18" y1="219" x2="290" y2="219" stroke="#1A1412" stroke-opacity="0.16" stroke-width="0.9"/>
      <path d="M 18 219 C 42 199, 64 239, 90 219 C 114 203, 138 234, 166 219 C 190 210, 214 226, 240 219 C 258 216, 274 220, 290 219" fill="none" stroke="#1A1412" stroke-width="1.25"/>
      <circle cx="0" cy="0" r="3.2" fill="#D95D39">
        <animateMotion dur="5.8s" repeatCount="indefinite" path="M 18,219 C 42,199 64,239 90,219 C 114,203 138,234 166,219 C 190,210 214,226 240,219 C 258,216 274,220 290,219"/>
      </circle>
      <circle cx="264" cy="219" r="7.5" fill="#9DBDD8" opacity="0.55">
        <animate attributeName="r" values="6;9;6" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="264" cy="219" r="2.5" fill="#1A1412"/>
    </g>

    <!-- INTEGRATED 4-COLUMN EDITORIAL IMPACT BAND (1:1 match with portfolio) -->
    <line x1="0" y1="342" x2="900" y2="342" stroke="#DDD4C7" stroke-width="1"/>
    <line x1="225" y1="342" x2="225" y2="456" stroke="#DDD4C7" stroke-width="1"/>
    <line x1="450" y1="342" x2="450" y2="456" stroke="#DDD4C7" stroke-width="1"/>
    <line x1="675" y1="342" x2="675" y2="456" stroke="#DDD4C7" stroke-width="1"/>

    <g transform="translate(36, 388)">
      <text x="0" y="0" class="serif" font-size="33" font-weight="400" fill="#1A1412">1,075+</text>
      <text x="0" y="22" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" letter-spacing="1.6">GITHUB CONTRIBUTIONS</text>
      <text x="0" y="39" class="sans" font-size="11" fill="#3D2F28">1,046 commits across 26+ repos</text>
    </g>

    <g transform="translate(249, 388)">
      <text x="0" y="0" class="serif" font-size="33" font-weight="400" fill="#1A1412">10,000+</text>
      <text x="0" y="22" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" letter-spacing="1.6">ACTIVE VETERINARIANS</text>
      <text x="0" y="39" class="sans" font-size="11" fill="#3D2F28">Served via Vetifi AI workflows</text>
    </g>

    <g transform="translate(474, 388)">
      <text x="0" y="0" class="serif" font-size="33" font-weight="400" fill="#1A1412">1,000+</text>
      <text x="0" y="22" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" letter-spacing="1.6">TDC REGISTRATIONS</text>
      <text x="0" y="39" class="sans" font-size="11" fill="#3D2F28">Builders across 5+ universities</text>
    </g>

    <g transform="translate(699, 388)">
      <text x="0" y="0" class="serif" font-size="33" font-weight="400" fill="#1A1412">0.261s</text>
      <text x="0" y="22" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" letter-spacing="1.6">TRACE LOCAL AUDIT</text>
      <text x="0" y="39" class="sans" font-size="11" fill="#3D2F28">189 files, 39 endpoints, 0 tokens</text>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="454" rx="18" stroke="#C5B9A9" stroke-width="1"/>
</svg>
