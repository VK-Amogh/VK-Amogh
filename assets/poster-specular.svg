<svg width="440" height="252" viewBox="0 0 440 252" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Specular · EvenEi — Memory, worn lightly.">
  <defs>
    <clipPath id="pclip_specular">
      <rect x="1" y="1" width="438" height="250" rx="16"/>
    </clipPath>
    <style>
      .serif { font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#pclip_specular)">
    <rect x="0" y="0" width="440" height="252" fill="#BACFAE"/>

    <!-- Flat drifting Bauhaus solid forms (straight from Poster.jsx) -->
    
        <circle cx="352" cy="116" r="106" fill="#EDB3C3">
          <animateTransform attributeName="transform" type="translate" values="0,0; -7,6; 0,0" dur="11s" repeatCount="indefinite"/>
        </circle>
        <rect x="-18" y="196" width="128" height="72" rx="36" fill="#F4EDE3" opacity="0.62"/>
        <rect x="318" y="194" width="108" height="66" rx="12" fill="#9DBDD8"/>

    <!-- Top meta bar -->
    <text x="26" y="30" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.72" letter-spacing="1.7">SPECULAR · EVENEI</text>
    <text x="414" y="30" text-anchor="end" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.72" letter-spacing="1.5">2024–2026</text>

    <!-- Two-line editorial serif headline (second line italic!) -->
    <text x="26" y="102" class="serif" font-size="34" font-weight="400" fill="#1A1412" letter-spacing="-0.6">Memory,</text>
    <text x="26" y="138" class="serif" font-size="34" font-weight="400" font-style="italic" fill="#1A1412" letter-spacing="-0.6">worn lightly.</text>

    <!-- Concise tagline -->
    <text x="26" y="166" class="sans" font-size="11.5" fill="#1A1412" fill-opacity="0.78">AI smart glasses · ESP32-S3 + Flutter.</text>
    <text x="26" y="182" class="sans" font-size="11.5" fill="#1A1412" fill-opacity="0.78">$1K seed · Google / Antler Immersion</text>

    <!-- Bespoke animated architectural vector motif on right -->
    <g transform="translate(274, 62)">
      <rect x="0" y="0" width="140" height="122" rx="12" fill="#F4EDE3" fill-opacity="0.88" stroke="#1A1412" stroke-opacity="0.22" stroke-width="1"/>
      
        <rect x="16" y="38" width="44" height="30" rx="15" fill="#BACFAE" fill-opacity="0.55" stroke="#1A1412" stroke-width="1.1"/>
        <rect x="80" y="38" width="44" height="30" rx="15" fill="#E9BF52" fill-opacity="0.55" stroke="#1A1412" stroke-width="1.1"/>
        <path d="M 60 51 Q 70 43 80 51" fill="none" stroke="#1A1412" stroke-width="1.2"/>
        <circle cx="38" cy="53" r="8" fill="none" stroke="#1A1412" stroke-width="1" stroke-dasharray="2.5 2.5">
          <animateTransform attributeName="transform" type="rotate" from="0 38 53" to="360 38 53" dur="9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="102" cy="53" r="4" fill="#D95D39">
          <animate attributeName="r" values="3.2;5.2;3.2" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="12" y="112" class="sans" font-size="8" font-weight="600" fill="#8F3E26" letter-spacing="1.2">SUB-20K INR BOM</text>
    </g>

    <!-- Bottom editorial footer & arrow -->
    <line x1="26" y1="214" x2="414" y2="214" stroke="#1A1412" stroke-opacity="0.16" stroke-width="1"/>
    <text x="26" y="234" class="sans" font-size="9.5" font-weight="600" fill="#1A1412" fill-opacity="0.76" letter-spacing="1.6">GLASSES, PHONE, CLOUD</text>
    <text x="414" y="235" text-anchor="end" class="sans" font-size="15" font-weight="400" fill="#1A1412">↗</text>
  </g>

  <rect x="1" y="1" width="438" height="250" rx="16" stroke="#1A1412" stroke-opacity="0.14" stroke-width="1"/>
</svg>
