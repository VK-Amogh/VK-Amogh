name: Update Zero-SVG Profile Telemetry & Animated GIFs

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_telemetry.py"

permissions:
  contents: write

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Regenerate animated progress & activity GIFs + live telemetry ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_telemetry.py

      - name: Commit updated assets and README telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/progress.gif assets/activity.gif README.md
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(telemetry): refresh animated progress & activity GIFs [skip ci]"
            git push
          fi
