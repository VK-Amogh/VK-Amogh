name: Update Quiet Studio Profile Telemetry & Animations

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_assets.py"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Quiet Studio animated SVGs & progress ledgers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_assets.py

      - name: Generate warm-paper editorial contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VK-Amogh
          outputs: |
            assets/snake-paper.svg?color_snake=d95d39&color_dots=#ece3d5,#bacfae,#a9ccc4,#1e5a52,#1a1412

      - name: Commit updated SVG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No SVG asset changes to commit."
          else
            git commit -m "chore(studio): refresh editorial SVGs, progress ledger & snake [skip ci]"
            git push
          fi
