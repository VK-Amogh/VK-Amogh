name: Update GitHub Profile Telemetry & Animations

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_assets.py"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate animated SVG telemetry & progress bars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_assets.py

      - name: Generate animated GitHub contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VK-Amogh
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=f59e0b&color_dots=#161b22,#0e4429,#006d32,#14b8a6,#38bdf8
            assets/snake-light.svg?palette=github-light&color_snake=0d9488

      - name: Commit updated SVG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No SVG asset changes to commit."
          else
            git commit -m "chore(telemetry): refresh animated SVGs and progress bars [skip ci]"
            git push
          fi
